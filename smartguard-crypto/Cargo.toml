[package]
name = "smartguard-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
rustyguard-core = { workspace = true }
rustyguard-crypto = { workspace = true }
openpgp-card = { workspace = true }
card-backend = { workspace = true }
subtle = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
iptrie = "0.11"
rand = "0.9"
ipnet = "2.12.0"
oneshot = { version = "0.2.1", features = ["async"] }

# Desktop-only transports: PC/SC links pcsclite, and rustyguard-tun's TUN
# backend is macOS/Linux only — neither builds for Android. The Android data
# plane and card transport live in the `smartguard-mobile` crate instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustyguard-tun = { workspace = true }
card-backend-pcsc = { workspace = true }
